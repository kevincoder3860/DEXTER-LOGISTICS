databases:
  - name: dextere-db
    plan: free
    region: oregon
    databaseName: dextere
    user: dextere

services:
  - type: web
    name: dextere-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn dextere_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dextere-db
          property: connectionString
      - key: FRONTEND_HOST
        fromService:
          type: web
          name: dextere-frontend
          property: host

  - type: web
    name: dextere-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: dextere-backend
          property: host
